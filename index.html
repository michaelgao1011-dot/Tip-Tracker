<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tip Book</title>
<meta name="description" content="Track server hours, cash tips and paychecks.">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tip Book">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F2F7;--cell:#FFFFFF;--cell2:#F2F2F7;--label:#000000;--label2:rgba(60,60,67,.6);--label3:rgba(60,60,67,.3);
  --sep:rgba(60,60,67,.18);--fill:rgba(120,120,128,.12);--fill2:rgba(120,120,128,.2);
  --blue:#007AFF;--green:#34C759;--red:#FF3B30;--orange:#FF9500;--indigo:#5856D6;--teal:#30B0C7;--pink:#FF2D55;--yellow:#FFCC00;
  --bar:rgba(249,249,249,.86);--shadow:0 1px 2px rgba(0,0,0,.04);
  --font:-apple-system,BlinkMacSystemFont,'SF Pro Text','Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --round:ui-rounded,'SF Pro Rounded',-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',Roboto,sans-serif;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000000;--cell:#1C1C1E;--cell2:#2C2C2E;--label:#FFFFFF;--label2:rgba(235,235,245,.6);--label3:rgba(235,235,245,.3);
  --sep:rgba(84,84,88,.55);--fill:rgba(118,118,128,.24);--fill2:rgba(118,118,128,.36);
  --blue:#0A84FF;--green:#30D158;--red:#FF453A;--orange:#FF9F0A;--indigo:#5E5CE6;--teal:#40C8E0;--pink:#FF375F;--yellow:#FFD60A;
  --bar:rgba(22,22,24,.84);--shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000;--cell:#1C1C1E;--cell2:#2C2C2E;--label:#FFFFFF;--label2:rgba(235,235,245,.6);--label3:rgba(235,235,245,.3);
  --sep:rgba(84,84,88,.55);--fill:rgba(118,118,128,.24);--fill2:rgba(118,118,128,.36);
  --blue:#0A84FF;--green:#30D158;--red:#FF453A;--orange:#FF9F0A;--indigo:#5E5CE6;--teal:#40C8E0;--pink:#FF375F;--yellow:#FFD60A;
  --bar:rgba(22,22,24,.84);--shadow:none;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;background:var(--bg);color:var(--label);font:400 17px/1.35 var(--font);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;padding-bottom:96px;min-height:100%;letter-spacing:-.01em}
img,svg{max-width:100%}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:6px}
.num{font-family:var(--round);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.wrap{max-width:600px;margin:0 auto;padding:8px 16px 24px}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:14px 4px 14px}
header.top h1{font:700 34px/1.1 var(--font);margin:0;letter-spacing:-.02em}
.sync{font-size:13px;color:var(--label2);padding-bottom:6px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--green)}
.sync.busy::before{background:var(--orange)}.sync.err::before{background:var(--red)}
.sec{font:600 20px/1.2 var(--font);margin:26px 4px 8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px;letter-spacing:-.01em}
.sec small{font:400 15px var(--font);color:var(--label2)}
.foot{font-size:13px;color:var(--label2);margin:8px 16px 0;line-height:1.4}
.muted{color:var(--label2)}

/* grouped lists */
.group{background:var(--cell);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:12px;min-height:50px;margin-left:16px;padding:8px 16px 8px 0;border-bottom:.5px solid var(--sep);width:calc(100% - 16px)}
.row:last-child{border-bottom:0}
.row .lbl{flex:1;min-width:0}
.row>.lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row>.lbl small{white-space:normal}
.row .lbl small{display:block;color:var(--label2);font-size:13px;line-height:1.3;margin-top:1px}
.row .val{color:var(--label2);text-align:right;font-variant-numeric:tabular-nums}
.row .val.strong{color:var(--label);font-weight:600}
.icon{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;color:#fff;flex:none}
.icon svg{width:18px;height:18px}
button.row{background:none;border:0;border-bottom:.5px solid var(--sep);text-align:left}
button.row:last-child{border-bottom:0}
button.row:active{background:var(--fill)}
.chev{color:var(--label3);flex:none}
.row input.field,.row select.field{flex:0 1 42%;min-width:0;border:0;background:transparent;color:var(--label);font:400 17px var(--font);text-align:right;padding:8px 0;min-height:40px;-webkit-appearance:none;appearance:none;font-variant-numeric:tabular-nums}
.row select.field{color:var(--label2);text-align-last:right;cursor:pointer}
.row input.field::placeholder{color:var(--label3)}
.row input.field:focus{outline:none;color:var(--blue)}
.row input.pill{flex:none;width:auto;border:0;background:var(--fill);color:var(--label);font:400 17px var(--font);border-radius:8px;padding:6px 10px;min-height:36px;max-width:150px;font-variant-numeric:tabular-nums}
textarea.note{display:block;width:100%;border:0;background:transparent;color:var(--label);font:400 17px/1.4 var(--font);padding:14px 16px;min-height:88px;resize:vertical}
textarea.note::placeholder{color:var(--label3)}
textarea.note:focus{outline:none}
.textbtn{background:none;border:0;color:var(--blue);font-weight:400;padding:0;min-height:44px}
.row.action{justify-content:center;color:var(--blue)}
.row.destructive{justify-content:center;color:var(--red)}
.switch{-webkit-appearance:none;appearance:none;width:51px;height:31px;border-radius:31px;background:var(--fill2);position:relative;flex:none;cursor:pointer;transition:background .2s;margin:0}
.switch::before{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 1px 1px rgba(0,0,0,.16);transition:transform .2s}
.switch:checked{background:var(--green)}
.switch:checked::before{transform:translateX(20px)}

/* segmented */
.seg{display:grid;grid-auto-columns:1fr;grid-auto-flow:column;background:var(--fill);border-radius:9px;padding:2px;gap:2px}
.seg button{border:0;background:transparent;border-radius:7px;padding:6px 8px;min-height:34px;font-size:14px;font-weight:500;line-height:1.2}
.seg button[aria-pressed="true"]{background:var(--cell);box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04);font-weight:600}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{background:#636366}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{background:#636366}}
.seg.tall button{min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:15px}
.seg.tall button small{font-size:12px;color:var(--label2);font-weight:400}

/* date bar */
.datebar{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;background:var(--cell);border-radius:12px;padding:6px;box-shadow:var(--shadow)}
.datebar .arrow{height:44px;width:44px;border:0;background:none;color:var(--blue);border-radius:10px;display:grid;place-items:center}
.datebar .arrow:active{background:var(--fill)}
.datebar .arrow svg{width:22px;height:22px}
.datepick{position:relative;text-align:center;display:block;padding:4px}
.datepick b{display:block;font:600 17px/1.25 var(--font)}
.datepick small{color:var(--label2);font-size:13px}
.datepick small.today{color:var(--blue);font-weight:600}
.datepick input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}

/* summary card */
.summary{background:var(--cell);border-radius:16px;padding:18px 18px 16px;margin-top:12px;box-shadow:var(--shadow)}
.summary .cap{font-size:15px;color:var(--label2);font-weight:500}
.summary .big{font:700 48px/1.05 var(--round);letter-spacing:-.03em;margin:4px 0 14px;font-variant-numeric:tabular-nums}
.minis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;border-top:.5px solid var(--sep);padding-top:12px}
.mini b{display:block;font:600 19px/1.2 var(--round);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.mini span{font-size:12px;color:var(--label2)}
.mini .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px}

/* tiles (dashboard) */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{background:var(--cell);border-radius:14px;padding:14px;box-shadow:var(--shadow);min-width:0}
.tile .head{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600}
.tile .head svg{width:18px;height:18px}
.tile b{display:block;font:700 28px/1.1 var(--round);margin-top:10px;letter-spacing:-.03em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.tile span.sub{font-size:13px;color:var(--label2)}
.hero{border-radius:18px;padding:20px;color:#fff;background:linear-gradient(160deg,#0A84FF 0%,#5856D6 100%);box-shadow:0 12px 30px -16px rgba(40,60,200,.6)}
.hero .cap{font-size:15px;opacity:.85;font-weight:500}
.hero .big{font:700 48px/1.05 var(--round);letter-spacing:-.03em;margin:6px 0 6px;font-variant-numeric:tabular-nums}
.hero p{margin:0;font-size:14px;opacity:.85;line-height:1.4}
.hero .hgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:16px;padding-top:14px;border-top:.5px solid rgba(255,255,255,.3)}
.hero .hgrid b{display:block;font:600 19px/1.2 var(--round);font-variant-numeric:tabular-nums}
.hero .hgrid span{font-size:12px;opacity:.8}
.card{background:var(--cell);border-radius:14px;padding:16px;box-shadow:var(--shadow)}
.card h3{font:600 17px/1.3 var(--font);margin:0}
.card p.cap{margin:2px 0 12px;font-size:14px;color:var(--label2)}
.chart{width:100%;height:auto;display:block}
.legend{display:flex;gap:16px;font-size:13px;color:var(--label2);margin-top:8px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.vs .side b{display:block;font:700 26px/1.1 var(--round);font-variant-numeric:tabular-nums}
.vs .side span{font-size:13px;color:var(--label2)}
.meter{height:8px;border-radius:4px;background:var(--fill);margin:8px 0 6px;overflow:hidden}
.meter i{display:block;height:100%;border-radius:4px}
table.heat{border-collapse:separate;border-spacing:4px;width:100%;font-size:15px}
table.heat th{font-weight:500;color:var(--label2);text-align:left;padding:2px 4px;font-size:13px}
table.heat td{text-align:center;padding:9px 4px;border-radius:8px;font-weight:600;font-variant-numeric:tabular-nums}
.banner{display:flex;gap:12px;align-items:center;background:var(--cell);border-radius:12px;padding:12px 14px;margin-bottom:12px;font-size:15px;box-shadow:var(--shadow)}
.banner .icon{background:var(--orange)}
.banner button{background:none;border:0;padding:0;color:var(--blue);font-size:15px}

/* paychecks */
.pay{background:var(--cell);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);margin-bottom:14px}
.pay-top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px 10px}
.pay-top h3{font:600 17px/1.3 var(--font);margin:0}
.pay-top small{color:var(--label2);font-size:13px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap}
.pill.ok{background:color-mix(in srgb,var(--green) 16%,transparent);color:var(--green)}
.pill.bad{background:color-mix(in srgb,var(--red) 14%,transparent);color:var(--red)}
.pill.wait{background:var(--fill);color:var(--label2)}
.compare{display:grid;grid-template-columns:1fr 1fr;border-top:.5px solid var(--sep)}
.compare>div{padding:12px 16px}
.compare>div+div{border-left:.5px solid var(--sep)}
.compare h4{margin:0 0 6px;font:500 13px var(--font);color:var(--label2)}
.kv{display:grid;grid-template-columns:1fr auto;gap:5px 10px;font-size:15px}
.kv .v{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.kv .tot{border-top:.5px solid var(--sep);padding-top:5px}
.note-box{margin:0 16px 14px;padding:10px 12px;border-radius:10px;font-size:15px;line-height:1.4}
.note-box.ok{background:color-mix(in srgb,var(--green) 12%,transparent)}
.note-box.bad{background:color-mix(in srgb,var(--red) 11%,transparent)}
.pay .bottom{border-top:.5px solid var(--sep)}
.pay .bottom button.row.action{width:100%;margin:0;padding:0 16px}
.form{border-top:.5px solid var(--sep)}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px 16px 16px}
.btn{min-height:50px;border-radius:12px;border:0;background:var(--blue);color:#fff;font-weight:600;font-size:17px;padding:0 16px}
.btn.gray{background:var(--fill);color:var(--blue)}
.btn.red{background:var(--fill);color:var(--red)}
.btn.block{width:100%}
.btn[disabled]{opacity:.5}
.empty{background:var(--cell);border-radius:14px;padding:32px 20px;text-align:center}
.empty .icon{width:56px;height:56px;border-radius:14px;margin:0 auto 12px}
.empty .icon svg{width:30px;height:30px}
.empty h3{margin:0 0 6px;font:600 20px var(--font)}
.empty p{color:var(--label2);margin:0 0 18px}

/* tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep);padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
nav.tabs .in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{background:none;border:0;color:#8E8E93;padding:7px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:500;min-height:54px}
nav.tabs button svg{width:26px;height:26px}
nav.tabs button[aria-current="page"]{color:var(--blue)}
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translate(-50%,-16px);background:var(--cell);color:var(--label);padding:12px 18px;border-radius:999px;font-weight:600;font-size:15px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:20;max-width:92vw;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.18);display:flex;align-items:center;gap:8px}
.toast::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--green);flex:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.loading{text-align:center;padding:90px 20px;color:var(--label2)}
.space{height:12px}
@media (max-width:370px){.minis{grid-template-columns:repeat(2,1fr)}.hero .hgrid{grid-template-columns:repeat(2,1fr)}.tile b{font-size:24px}}
@media (min-width:700px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (prefers-reduced-motion:reduce){.toast,.switch,.switch::before{transition:none}}
/* ===== easy-read layer ===== */
:root{--label2:rgba(60,60,67,.78);--label3:rgba(60,60,67,.45)}
:root[data-theme="dark"]{--label2:rgba(235,235,245,.78);--label3:rgba(235,235,245,.45)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--label2:rgba(235,235,245,.78);--label3:rgba(235,235,245,.45)}}
body{font-size:18px}
.card{margin-bottom:14px;padding:18px}
.card h2,.half-head h2{font:700 22px/1.2 var(--font);margin:0}
.intro{font-size:18px;line-height:1.45;margin:0 0 18px}
.foot{font-size:15px}
.foot.center{text-align:center}
.fieldset{display:block;margin:0 0 18px}
.fieldset .q{display:block;font-weight:600;font-size:18px}
.fieldset small{display:block;color:var(--label2);font-size:15px;line-height:1.35;margin-top:2px}
.fieldset>.money,.fieldset>.bigin,.fieldset>.stepper{margin-top:8px}
.money{display:flex;align-items:center;background:var(--cell2);border:2px solid transparent;border-radius:12px;padding:0 14px;min-height:58px}
.money:focus-within,.bigin:focus,.stepper input:focus{border-color:var(--blue);outline:none}
.money span{font-size:22px;color:var(--label2);margin-right:6px}
.money input{flex:1;min-width:0;border:0;background:transparent;font:600 24px var(--round);color:var(--label);padding:12px 0;outline:none}
.bigin{display:block;width:100%;background:var(--cell2);border:2px solid transparent;border-radius:12px;min-height:58px;padding:12px 14px;font:600 20px var(--font);color:var(--label);-webkit-appearance:none;appearance:none}
textarea.bigin{font-weight:400;font-size:18px;min-height:70px;resize:vertical}
.stepper{display:grid;grid-template-columns:64px 1fr 64px;gap:10px}
.stepper button{height:58px;border-radius:12px;border:0;background:var(--fill);color:var(--blue);font-size:30px;font-weight:500;line-height:1}
.stepper button:active{background:var(--fill2)}
.stepper input{min-width:0;height:58px;text-align:center;background:var(--cell2);border:2px solid transparent;border-radius:12px;font:700 28px var(--round);color:var(--label)}
.half-head{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.half-head small{color:var(--label2);font-size:15px}
.half-head .icon{width:40px;height:40px;border-radius:10px}
.half-head .icon svg{width:22px;height:22px}
.half-total{margin-left:auto;font:700 22px var(--round);color:var(--green)}
.half .fieldset:last-child{margin-bottom:0}
.daypick{margin-bottom:12px}
.daypick button,.seg-date{min-height:50px;font-size:17px}
.seg-date{position:relative;display:flex;align-items:center;justify-content:center;border-radius:7px;font-weight:500;cursor:pointer}
.seg-date[aria-pressed="true"]{background:var(--cell);box-shadow:0 3px 8px rgba(0,0,0,.12);font-weight:600}
.seg-date input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.seg button{font-size:16px;min-height:44px}
.date-big{font:700 24px/1.25 var(--font);margin:6px 4px 16px}
.daytotal{text-align:center}
.dt-label{font-size:18px;color:var(--label2);font-weight:500}
.dt-big{font:700 52px/1.1 var(--round);color:var(--green);margin:4px 0 14px;font-variant-numeric:tabular-nums}
.dt-lines{text-align:left;border-top:.5px solid var(--sep)}
.dt-lines div{display:flex;justify-content:space-between;padding:10px 2px;border-bottom:.5px solid var(--sep);font-size:18px}
.dt-lines div:last-child{border-bottom:0}
.dt-lines b{font-variant-numeric:tabular-nums}
.btn{min-height:58px;font-size:19px;border-radius:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn svg{width:22px;height:22px}
.btn.save{background:var(--green)}
.linkbtn{display:block;margin:10px auto 0;background:none;border:0;font-size:17px;min-height:48px;padding:0 16px}
.linkbtn.danger{color:var(--red)}
.row{min-height:60px}
.row .lbl{font-size:18px}
.row .lbl small{font-size:15px}
.row .val.strong{font-size:19px}
.bignums .val.strong{font:700 22px var(--round)}
.val.green{color:var(--green)!important}
.rank{width:32px;height:32px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.say{font-size:18px;margin:0 0 14px;line-height:1.4}
.barrow{display:grid;grid-template-columns:110px 1fr auto;align-items:center;gap:10px;margin:8px 0;font-size:17px}
.barrow .meter{margin:0;height:14px;border-radius:7px}
.barrow b{font-variant-numeric:tabular-nums;min-width:70px;text-align:right}
.hero .cap{font-size:18px}
.hero .big{font-size:52px}
.hero .hgrid b{font-size:22px}
.hero .hgrid span{font-size:15px}
.pay-top{padding:0;margin-bottom:12px}
.answer{display:flex;align-items:center;gap:10px;border-radius:12px;padding:14px;font-size:18px;font-weight:600;margin-bottom:14px}
.answer svg{width:26px;height:26px;flex:none}

<script>
(function(){
"use strict";
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const diffDays=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const todayISO=()=>iso(new Date());
const num=v=>{if(v==null)return 0;const n=parseFloat(String(v).replace(/[^0-9.\-]/g,''));return isFinite(n)?n:0};
const r2=n=>Math.round(n*100)/100;
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const DOWL=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const HALVES=[['am','First half'],['pm','Second half']];
function mondayOnOrBefore(s){const d=parse(s);return addDays(s,-((d.getDay()+6)%7))}
const cur=()=>state.settings.currency||'$';
function money(n,dec=2){const neg=n<0;const s=Math.abs(n).toLocaleString(undefined,{minimumFractionDigits:dec,maximumFractionDigits:dec});return (neg?'−':'')+cur()+s}
function compact(n){if(Math.abs(n)>=1000)return cur()+(n/1000).toFixed(n>=10000?0:1)+'k';return cur()+Math.round(n)}
function hrs(n){return (Math.round(n*100)/100).toLocaleString(undefined,{maximumFractionDigits:2})}
function fmtDate(s,opt){return parse(s).toLocaleDateString(undefined,opt||{weekday:'short',month:'short',day:'numeric'})}
function fmtShort(s){return parse(s).toLocaleDateString(undefined,{month:'short',day:'numeric'})}

/* ---------- state ---------- */
const DEFAULTS={wage:'',currency:'$',periodAnchor:mondayOnOrBefore(todayISO()),otThreshold:40,otMult:1.5,cardTipsOnCheck:true,theme:'auto',textSize:'large',voice:true,voiceLang:'zh-CN'};
const state={settings:{...DEFAULTS},days:{},pays:{},view:'log',cur:todayISO(),range:'year',half:'am',editPay:null,ready:false};
const wage=()=>num(state.settings.wage);

/* ---------- storage ---------- */
const LKEY='tipbook.v1';
const Store={
  mode:'local',db:null,uid:null,chain:Promise.resolve(),
  async init(){
    try{
      if(window.claude&&typeof window.claude.use==='function'){
        const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
        if(db&&user){const uid=await user.id();if(uid){this.db=db;this.uid=uid;this.mode='cloud'}}
      }
    }catch(e){}
    if(this.mode==='cloud'){
      try{
        const snap=await this.col().get();
        snap.docs.forEach(d=>ingest(d.id,d.data()));
        if(snap.empty){
          const local=readLocal();
          if(local&&(Object.keys(local.days||{}).length||Object.keys(local.pays||{}).length)){
            applyLocal(local);
            this.put('settings',state.settings);
            Object.entries(state.days).forEach(([k,v])=>this.put('d_'+k,v));
            Object.entries(state.pays).forEach(([k,v])=>this.put('p_'+k,v));
          }
        }
        return;
      }catch(e){this.mode='local'}
    }
    const local=readLocal();if(local)applyLocal(local);
  },
  col(){return this.db.collection('data/users/'+this.uid)},
  put(id,data){return this.write(id,data)},
  del(id){return this.write(id,null)},
  write(id,data){
    if(this.mode!=='cloud'){writeLocal();return Promise.resolve()}
    setSync('Saving…','busy');
    const run=async()=>{
      const ref=this.col().doc(id);
      const go=()=>data===null?ref.delete():ref.set(JSON.parse(JSON.stringify(data)));
      try{await go()}catch(e){
        if(e&&e.code==='unavailable'){await new Promise(r=>setTimeout(r,600+Math.random()*800));await go()}
        else throw e;
      }
    };
    this.chain=this.chain.then(run).then(()=>setSync('Saved'),e=>{
      setSync('Not saved','err');
      toast(e&&e.code==='quota_exceeded'?'Storage is full. Delete old entries to save new ones.':"Couldn't save. Check your connection and try again.");
    });
    return this.chain;
  }
};
function ingest(id,data){
  if(!data)return;
  if(id==='settings')state.settings={...DEFAULTS,...data};
  else if(id.startsWith('d_'))state.days[id.slice(2)]=data;
  else if(id.startsWith('p_'))state.pays[id.slice(2)]=data;
}
function readLocal(){try{const s=localStorage.getItem(LKEY);return s?JSON.parse(s):null}catch(e){return null}}
function applyLocal(l){state.settings={...DEFAULTS,...(l.settings||{})};state.days=l.days||{};state.pays=l.pays||{}}
function writeLocal(){try{localStorage.setItem(LKEY,JSON.stringify({settings:state.settings,days:state.days,pays:state.pays}));setSync('On this device')}catch(e){toast("Couldn't save on this device.")}}
function setSync(t,k){const e=$('#sync');e.textContent=t;e.className='sync'+(k?' '+k:'')}

/* ---------- calculations ---------- */
function halfHours(h){
  if(h&&h.hours!=null&&h.hours!=='')return Math.max(0,num(h.hours));
  if(!h||!h.start||!h.end)return 0;
  const [sh,sm]=h.start.split(':').map(Number),[eh,em]=h.end.split(':').map(Number);
  let m=(eh*60+em)-(sh*60+sm);if(m<=0)m+=1440;m-=num(h.brk);
  return Math.max(0,m)/60;
}
function halfCalc(h){
  h=h||{};const hours=halfHours(h),cash=num(h.cash)+num(h.card),card=0,out=0;
  const tips=cash-out,wages=hours*wage();
  return {hours,cash,card,out,tips,wages,total:tips+wages,worked:hours>0||cash>0};
}
function dayCalc(s){
  const d=state.days[s]||{};const am=halfCalc(d.am),pm=halfCalc(d.pm);
  const o={am,pm,note:d.note||''};
  ['hours','cash','card','out','tips','wages','total'].forEach(k=>o[k]=am[k]+pm[k]);
  o.worked=am.worked||pm.worked;return o;
}
function periodStartFor(s){const a=state.settings.periodAnchor;return addDays(a,Math.floor(diffDays(a,s)/14)*14)}
function weekStartFor(s){const a=state.settings.periodAnchor;return addDays(a,Math.floor(diffDays(a,s)/7)*7)}
function weekCalc(ws){
  const o={ws,hours:0,tips:0,card:0,cash:0,out:0,days:0};
  for(let i=0;i<7;i++){const c=dayCalc(addDays(ws,i));if(!c.worked)continue;o.days++;o.hours+=c.hours;o.tips+=c.tips;o.card+=c.card;o.cash+=c.cash;o.out+=c.out}
  const thr=num(state.settings.otThreshold),m=num(state.settings.otMult)||1,w=wage();
  o.reg=thr>0?Math.min(o.hours,thr):o.hours;o.ot=o.hours-o.reg;
  o.wages=o.reg*w+o.ot*w*m;o.earn=o.wages+o.tips;return o;
}
function periodCalc(ps){
  const a=weekCalc(ps),b=weekCalc(addDays(ps,7));const o={ps,pe:addDays(ps,13)};
  ['hours','reg','ot','tips','card','cash','out','wages','days'].forEach(k=>o[k]=a[k]+b[k]);
  o.checkTips=0;
  o.gross=o.wages+o.checkTips;return o;
}
function payAmount(pay){if(!pay)return '';const v=pay.amount!=null?pay.amount:pay.gross;return v==null?'':String(v)}
function reconcile(p,pay){
  const a=payAmount(pay);if(a==='')return {status:'none'};
  const w=wage(),dg=num(a)-p.gross,dh=w?dg/w:0,paidHours=Math.max(0,p.hours+dh);
  if(Math.abs(dg)<0.5)return {status:'match',dg,dh,paidHours};
  return {status:dg<0?'short':'over',dg,dh,paidHours};
}
function datesSorted(){return Object.keys(state.days).filter(s=>dayCalc(s).worked).sort()}
function totals(a,b){
  const t={hours:0,tips:0,wages:0,cash:0,card:0,out:0,shifts:0,days:0,ot:0,am:{hours:0,tips:0,n:0},pm:{hours:0,tips:0,n:0}};
  for(const s of Object.keys(state.days)){
    if(s<a||s>b)continue;const c=dayCalc(s);if(!c.worked)continue;t.days++;
    for(const [k] of HALVES){const h=c[k];if(!h.worked)continue;t.shifts++;t[k].hours+=h.hours;t[k].tips+=h.tips;t[k].n++}
    t.hours+=c.hours;t.tips+=c.tips;t.wages+=c.wages;t.cash+=c.cash;t.card+=c.card;t.out+=c.out;
  }
  const thr=num(state.settings.otThreshold),m=num(state.settings.otMult)||1,w=wage();
  if(thr>0&&m>1&&t.days){for(let ws=weekStartFor(a);ws<=b;ws=addDays(ws,7)){const wc=weekCalc(ws);t.ot+=wc.ot;t.wages+=wc.ot*w*(m-1)}}
  t.earn=t.tips+t.wages;return t;
}
function forecast(){
  const ds=datesSorted();if(!ds.length)return null;
  const today=todayISO(),yr=today.slice(0,4),curWs=weekStartFor(today),firstWs=weekStartFor(ds[0]);
  const weeks=[];for(let i=1;i<=8;i++){const ws=addDays(curWs,-7*i);if(ws<firstWs)break;weeks.push(weekCalc(ws))}
  const ytd=totals(yr+'-01-01',today);
  if(!weeks.length)return {ytd,n:0};
  const avgEarn=weeks.reduce((s,w)=>s+w.earn,0)/weeks.length,avgHours=weeks.reduce((s,w)=>s+w.hours,0)/weeks.length,avgTips=weeks.reduce((s,w)=>s+w.tips,0)/weeks.length;
  const remWeeks=Math.max(0,diffDays(today,yr+'-12-31'))/7;
  return {ytd,n:weeks.length,avgEarn,avgHours,avgTips,remWeeks,projected:ytd.earn+avgEarn*remWeeks,pace:avgEarn*52,hourly:avgHours?avgEarn/avgHours:0,yr};
}

/* ---------- UI plumbing ---------- */
let toastT;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2400)}
function applySize(){const s=state.settings.textSize||'large';document.body.classList.remove('tsize-normal','tsize-large','tsize-xl');document.body.classList.add('tsize-'+s)}
function applyTheme(){applySize();const t=state.settings.theme;if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);else document.documentElement.removeAttribute('data-theme')}
function go(v){flushDay();state.view=v;render();window.scrollTo(0,0)}
function render(){
  document.querySelectorAll('[data-nav]').forEach(b=>b.setAttribute('aria-current',b.dataset.nav===state.view?'page':'false'));
  $('#title').textContent=TITLES[state.view];

const DEF_P={am_start:'AM',am_end:'PM',pm_start:'PM',pm_end:'PM'};
function timePick(id,label,val){
  let hh='',mm='00',pp=DEF_P[id];
  if(val){const [H,M]=val.split(':').map(Number);pp=H>=12?'PM':'AM';hh=String(H%12||12);mm=pad(M)}
  const mins=[];for(let m=0;m<60;m+=5)mins.push(pad(m));if(!mins.includes(mm))mins.push(mm),mins.sort();

function readTime(id){

function hm(x){const t=Math.round(x*60),H=Math.floor(t/60),M=t%60;return (H?H+(H===1?' hr':' hrs'):'')+(H&&M?' ':'')+(M?M+' min':'')||'0 hrs'}
function to12(v){if(!v)return '';const [H,M]=v.split(':').map(Number);return `${H%12||12}:${pad(M)} ${H>=12?'PM':'AM'}`}

function readForm(){

function weeklyChart(){
  const curWs=weekStartFor(todayISO()),weeks=[];for(let i=11;i>=0;i--)weeks.push(weekCalc(addDays(curWs,-7*i)));
  const W=340,H=200,L=42,B=26,T=8,max=Math.max(1,...weeks.map(w=>w.earn)),cw=(W-L)/weeks.length,bw=Math.min(18,cw*.6);
  const y=v=>T+(H-T-B)*(1-v/max);
  let g='';
  for(let i=0;i<=2;i++){const v=max*i/2,yy=y(v);g+=`<line x1="${L}" x2="${W}" y1="${yy}" y2="${yy}" stroke="var(--sep)"/><text x="${L-8}" y="${yy+4}" text-anchor="end" font-size="12" fill="var(--label2)">${esc(compact(v))}</text>`}
  weeks.forEach((w,i)=>{
    const x=L+i*cw+(cw-bw)/2,wy=y(Math.max(0,w.wages)),ty=y(Math.max(0,w.wages)+Math.max(0,w.tips)),base=H-B;
    const tt=`<title>Week of ${esc(fmtShort(w.ws))}: ${esc(money(w.earn))}</title>`;
    if(w.earn>0){
      g+=`<clipPath id="c${i}"><rect x="${x}" y="${ty}" width="${bw}" height="${base-ty}" rx="${bw/3}"/></clipPath><g clip-path="url(#c${i})">`;
      g+=`<rect x="${x}" y="${wy}" width="${bw}" height="${base-wy+10}" fill="var(--blue)">${tt}</rect><rect x="${x}" y="${ty}" width="${bw}" height="${wy-ty}" fill="var(--green)">${tt}</rect></g>`;
    }else g+=`<rect x="${x}" y="${base-3}" width="${bw}" height="3" rx="1.5" fill="var(--fill2)"/>`;

function bestShifts(a,b){

function buildWorkbook(){

      (ratios||[]).forEach(([c,n,d])=>{const nv=rows.reduce((s,r)=>s+(r[n]||0),0),dv=rows.reduce((s,r)=>s+(r[d]||0),0);

    [0,0,0,0,0,0,'h','m','m','m','m'],[6,7,8,9],[[10,9,6]]),'Shifts');

  const dy=ds.map(s=>{const c=dayCalc(s);return [s,DOW[parse(s).getDay()],r2(c.hours),r2(c.tips),r2(c.wages),r2(c.total),c.hours?r2(c.total/c.hours):0,c.note]});
  X.utils.book_append_sheet(wb,sheet(['Date','Day','Hours','Cash tips','Wages','Total','Per hour','Notes'],dy,[0,0,'h','m','m','m','m',0],[2,3,4,5],[[6,5,2]]),'Days');
  // Weeks
  const wk=[];if(ds.length){for(let ws=weekStartFor(ds[0]);ws<=todayISO();ws=addDays(ws,7)){const w=weekCalc(ws);if(!w.days)continue;
    wk.push([ws,addDays(ws,6),w.days,r2(w.hours),r2(w.reg),r2(w.ot),r2(w.wages),r2(w.tips),r2(w.earn),w.hours?r2(w.earn/w.hours):0])}}
  X.utils.book_append_sheet(wb,sheet(['Week start','Week end','Days worked','Hours','Regular hours','Overtime hours','Wages (incl. overtime)','Cash tips','Total','Per hour'],wk,
    [0,0,0,'h','h','h','m','m','m','m'],[2,3,4,5,6,7,8],[[9,8,3]]),'Weeks');
  // Pay periods
  const pp=periodsList().slice().reverse().map(ps=>{const p=periodCalc(ps),pay=state.pays[ps],rc=reconcile(p,pay),a=payAmount(pay),has=rc.status!=='none';
    return [ps,p.pe,r2(p.hours),r2(p.ot),r2(p.gross),a!==''?r2(num(a)):'',has?r2(rc.dg):'',has?r2(rc.paidHours):'',has?r2(-rc.dh):'',
      {none:'No paycheck entered',match:'Correct',short:'Paid less than logged',over:'Paid more than logged'}[rc.status]]});
  X.utils.book_append_sheet(wb,sheet(['Period start','Period end','Hours logged','Overtime hours','Wages you should get','Wages on paycheck','Difference','Hours paycheck covers (about)','Hours missing (about)','Status'],pp,
    [0,0,'h','h','m','m','m','h','h',0]),'Pay periods');

  const sm=years.map(y=>{const t=totals(y+'-01-01',y+'-12-31');return [y,t.days,t.shifts,r2(t.hours),r2(t.tips),r2(t.wages),r2(t.earn),t.hours?r2(t.earn/t.hours):0,t.hours?r2(t.tips/t.hours):0]});
  const sws=sheet(['Year','Days worked','Shifts','Hours','Cash tips','Wages','Total earned','Per hour','Tips per hour'],sm,[0,0,0,'h','m','m','m','m','m']);

    X.utils.sheet_add_aoa(sws,rowsF,{origin:{r:base,c:0}});

    const c3=sws[X.utils.encode_cell({r:base+3,c:1})];if(c3)c3.z=Hf;}

async function deliverFile(name,blob,mime){
  let dl=null;try{dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null}catch(e){}
  if(dl){await dl.save({filename:name,data:blob});return 'saved'}
  const file=new File([blob],name,{type:mime});
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file],title:name});return 'saved'}catch(e){if(e&&e.name==='AbortError')return 'cancel';}
  }
  const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);return 'saved';
}
async function exportExcel(btn){

    const r=await deliverFile(`Tip Book ${todayISO()}.xlsx`,new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
    if(r==='saved')toast('Excel file ready');
  }catch(e){
    const c=e&&e.code;
    if(c==='declined'){}else toast("Couldn't create the file. Try again.");
  }finally{if(btn)btn.disabled=false}
}

/* ---------- VOICE: Mandarin / English parser ---------- */
const CN_D={'零':0,'〇':0,'一':1,'二':2,'两':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9};
const CN_U={'十':10,'百':100,'千':1000,'万':10000};
function cn2num(s){
  let total=0,sec=0,n=0,last=0,zero=false;
  for(const ch of s){
    if(ch in CN_D){if(CN_D[ch]===0)zero=true;n=CN_D[ch]}
    else if(ch in CN_U){const v=CN_U[ch];if(v===10000){total+=(sec+n)*v;sec=0}else sec+=(n||1)*v;n=0;last=v;zero=false}
  }
  if(n&&!zero&&last>=100)n*=last/10;
  return total+sec+n;
}
function normVoice(t){
  const trad={'點':'点','塊':'块','費':'费','個':'个','鐘':'钟','給':'给','時':'时','萬':'万','兩':'两','現':'现','錢':'钱','賺':'赚','掙':'挣','晚':'晚','從':'从','勞':'劳','休':'休','後':'后','幫':'帮','拿':'拿','們':'们','收':'收','結':'结','東':'东','開':'开','班':'班','還':'还','裡':'里','凌':'凌','點':'点'};
  t=t.replace(/[點塊費個鐘給時萬兩現錢賺掙從後幫們結開還裡]/g,c=>trad[c]||c);
  t=t.replace(/[，。,、！？!?；;]/g,' ').replace(/：/g,':');
  // common speech-recognition mistakes in Mandarin
  t=t.replace(/消费|小飞|小肥|小非|晓费|孝费/g,'小费').replace(/现今|线金|限金|现经/g,'现金').replace(/休习|修习|休憩|修息/g,'休息')
     .replace(/夏午/g,'下午').replace(/(^|[^晚早])([上下中])五(?=\s*[0-9零〇一二两三四五六七八九十])/g,'$1$2午').replace(/晚尚/g,'晚上')
     .replace(/([0-9零〇一二两三四五六七八九十])\s*[店典电](?=\s*[0-9零〇一二两三四五六七八九十半到至钟整]|\s|$)/g,'$1点')
     .replace(/([0-9零〇一二两三四五六七八九十百])\s*[快筷]/g,'$1块').replace(/(\d)\s*[Dd]ollars?/g,'$1美元')
     .replace(/点钟/g,'点').replace(/点整/g,'点').replace(/分钟钟/g,'分钟').replace(/块钱/g,'块').replace(/元钱/g,'元');
  t=t.replace(/[零〇一二两三四五六七八九十百千万]+/g,m=>String(cn2num(m)));
  t=t.replace(/差\s*(\d+)\s*刻\s*(\d+)\s*点/g,(_,q,h)=>(+h-1)+'点'+(60-15*q)).replace(/差\s*(\d+)\s*分\s*(\d+)\s*点/g,(_,m,h)=>(+h-1)+'点'+(60-m));
  t=t.replace(/点半/g,'点30').replace(/点\s*1\s*刻/g,'点15').replace(/点\s*3\s*刻/g,'点45');
  t=t.replace(/(\d+)\s*个半\s*(小时|钟头)/g,(_,n)=>(+n*60+30)+'分钟');
  t=t.replace(/半\s*个?\s*(小时|钟头)/g,'30分钟');
  t=t.replace(/(\d+(?:\.\d+)?)\s*个?\s*(小时|钟头)/g,(_,n)=>Math.round(+n*60)+'分钟');
  t=t.replace(/(\d+)\s*(?:half an hour|and a half hours?)/gi,(_,n)=>(+n*60+30)+' minutes');
  t=t.replace(/half an hour/gi,'30 minutes').replace(/(\d+(?:\.\d+)?)\s*hours?/gi,(_,n)=>Math.round(+n*60)+' minutes');
  t=t.replace(/块\s*半/g,'块5');
  t=t.replace(/(\d+)点(\d+)\s*(块|元|美元|美金|刀)/g,'$1.$2$3');
  return t;
}
function moneyVal(m,a,b,c,d){let v=parseFloat(a);if(c&&/[毛角]/.test(d||''))v+=+c/10;else if(c&&/[块元刀]/.test(b||''))v+=+c/10;return Math.round(v*100)/100}
function parseVoice(raw,half){
  let t=normVoice(raw);const out={};
  // break
  let m=t.match(/(休息|吃饭|午休|break)\D{0,4}?(\d+)\s*(分钟|分|minutes?|mins?)?/i)||t.match(/(\d+)\s*(?:minutes?|mins?)\s*break/i);
  if(m){out.brk=+(m[2]||m[1]);t=t.replace(m[0],' ')}
  else if(/(没有?休息|不休息|no break)/i.test(t)){out.brk=0}
  const cur='(块|元|美元|美金|刀|加元|dollars?|bucks)?(?:钱)?\\s*(\\d)?\\s*(毛|角)?';
  // paid out
  m=t.match(new RegExp('(分给|分出去?|分了|给了|付给|付了|交了|上交|给|tip\\s*out|tipped\\s*out|gave|paid\\s*out)\\D{0,10}?(\\d+(?:\\.\\d+)?)\\s*'+cur,'i'));
  if(m){out.out=moneyVal(m,m[2],m[3],m[4],m[5]);t=t.replace(m[0],' ')}
  // tips
  t=t.replace(/(小费|现金|tips?|cash)(\D{0,8}?)(\d+)点(\d{1,2})(?!\s*(?:点|分|到|至|\d))/gi,'$1$2$3.$4');
  m=t.match(new RegExp('(小费|现金|赚了|挣了|收了|拿了|tips?|cash|made)\\D{0,8}?(\\d+(?:\\.\\d+)?)\\s*'+cur,'i'));
  if(m){out.cash=moneyVal(m,m[2],m[3],m[4],m[5]);t=t.replace(m[0],' ')}
  else{m=t.match(/(\d+(?:\.\d+)?)\s*(块|元|美元|美金|刀|dollars?|bucks)(?:钱)?\s*(\d)?\s*(毛|角)?/i);if(m){out.cash=moneyVal(m,m[1],m[2],m[3],m[4]);t=t.replace(m[0],' ')}}
  // times
  const times=[];let r;
  const zh=/(凌晨|早上|早晨|上午|中午|下午|傍晚|晚上|夜里|夜晚|半夜)?\s*(\d{1,2})\s*(?:点|时)\s*(?:(\d{1,2})\s*分?)?/g;
  while((r=zh.exec(t)))times.push({i:r.index,h:+r[2],m:+(r[3]||0),p:r[1]||''});
  const en=/(\d{1,2})(?::(\d{2}))?\s*(a\.?\s?m\.?|p\.?\s?m\.?)|(\d{1,2}):(\d{2})/gi;
  while((r=en.exec(t))){if(times.some(x=>Math.abs(x.i-r.index)<2))continue;
    if(r[4])times.push({i:r.index,h:+r[4],m:+r[5],p:''});else times.push({i:r.index,h:+r[1],m:+(r[2]||0),p:/p/i.test(r[3])?'pm':'am'})}
  times.sort((a,b)=>a.i-b.i);
  if(times.length<2){const f=t.match(/(\d{1,2})(?::(\d{2}))?\s*(?:到|至|to|until|till|-|~)\s*(\d{1,2})(?::(\d{2}))?(?!\d)/i);
    if(f){times.length=0;times.push({h:+f[1],m:+(f[2]||0),p:''},{h:+f[3],m:+(f[4]||0),p:''})}}
  const valid=x=>x.h<=24&&x.m<60;
  const P=(x,fallback)=>{
    const h=x.h,p=x.p;if(h>12)return h%24;
    if(/上午|早上|早晨|am/.test(p))return h%12;

    if(/中午/.test(p))return h===11?11:h%12+12;
    if(/晚上|夜里|夜晚/.test(p))return h===12?0:(h<=4?h:h%12+12);
    if(/下午|傍晚|pm/.test(p))return h%12+12;
    return fallback(h);
  };
  const ts=times.filter(valid);
  let sMin=null;
  if(ts.length>=1&&!(ts.length===1&&/(下班|结束|到|until|till|off)/i.test(raw)&&!/(上班|开始|从|start)/i.test(raw))){
    const s=ts[0];const H=P(s,h=>half==='am'?(h===12?12:h>=6?h:h+12):(h===12?12:h+12));
    out.start=pad(H)+':'+pad(s.m);sMin=H*60+s.m;
  }
  const e=ts.length>=2?ts[1]:(ts.length===1&&out.start===undefined?ts[0]:null);
  if(e){const H=P(e,h=>{if(sMin==null)return half==='am'?(h>=6&&h<12?h:h%12+12):h%12+12;
      let best=null,bd=1e9;for(const c of [h%12,h%12+12]){let d=((c*60+e.m)-sMin+1440)%1440;if(d===0)d=1440;if(d<bd){bd=d;best=c}}return best});
    out.end=pad(H)+':'+pad(e.m)}
  return out;
}

    r.onend=()=>{
      const f=$('#dfix'),t=$('#dtest');if(!f)return;
      if(got){t.className='dok';t.textContent=T.heard+' '+got;f.textContent=T.fix.ok;state.settings.voiceMode='auto';saveSettings()}
      else{t.className='dbad';const key=err||(started?'no-speech':'no-start');t.textContent=key;f.textContent=(isEmbedded()?T.fix.embed+' ':'')+(T.fix[key]||'')}
    };
    r.start();setTimeout(()=>{if(!started&&!got){err=err||'no-start';try{r.abort()}catch(e){}}},4000);
  }catch(e){$('#dtest').textContent='start-failed';$('#dfix').textContent=T.fix['no-start']}
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.dataset.nav){go(t.dataset.nav);return}
  if(t.dataset.go){state.cur=t.dataset.go;go('log');return}
  if(t.dataset.act==='export'){exportExcel(t);return}
  if(t.dataset.clearhalf){const k=t.dataset.clearhalf;['_start_h','_end_h'].forEach(x=>$('#'+k+x).value='');$('#'+k+'_brk').value='0';$('#'+k+'_hours').value='';$('#'+k+'_cash').value='';onLogInput();toast('Cleared');return}
  if(t.dataset.day){setDay(t.dataset.day==='today'?todayISO():addDays(todayISO(),-1));return}
  if(t.dataset.size){state.settings.textSize=t.dataset.size;saveSettings();renderSettings();return}
  if(t.dataset.voice){openVoice(t.dataset.voice);return}
  if(t.dataset.range){state.range=t.dataset.range;renderInsights();return}
  if(t.dataset.editpay){state.editPay=t.dataset.editpay;renderPay();const el=$('#pf_amount');if(el)el.focus();return}
  if(t.hasAttribute('data-cancelpay')){state.editPay=null;renderPay();return}
  if(t.dataset.savepay){const ps=t.dataset.savepay;
    const o={amount:$('#pf_amount').value.trim()};
    if(!num(o.amount)){toast('Type in the wage amount from your paycheck');$('#pf_amount').focus();return}
    state.pays[ps]=o;Store.put('p_'+ps,o);state.editPay=null;renderPay();toast('Paycheck saved');return}
  if(t.dataset.delpay){const ps=t.dataset.delpay;twoStep(t,'pay'+ps,'Tap again to remove it',()=>{delete state.pays[ps];Store.del('p_'+ps);state.editPay=null;renderPay();toast('Paycheck removed')});return}
  switch(t.id){
    case 'v_mic':if(vListening||rec)stopListening(true);else{vTries=0;$('#vsheet').classList.remove('kb');startListening()}break;
    case 'v_cancel':closeVoice();break;
    case 'v_fill':applyVoice();break;
    case 'v_kb':{const b=$('#vbox');if(b){b.focus();b.setSelectionRange(b.value.length,b.value.length)}break}
    case 'diag_run':runVoiceCheck();break;
    case 'sc_copy':{const u=$('#sc_url').textContent;(navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>toast(vl()==='en-US'?'Copied':'已复制'),()=>{const r=document.createRange();r.selectNodeContents($('#sc_url'));const s=getSelection();s.removeAllRanges();s.addRange(r);toast(vl()==='en-US'?'Select and copy the address':'请长按复制网址')});break}
    case 'diag_reset':state.settings.voiceMode='auto';saveSettings();toast('OK');renderSettings();break;
    case 'saveDay':{const o=readForm();if(!Object.keys(o).length){toast('Type in your hours or tips first');break}flushDay();if(!dirtyDay&&state.days[state.cur])Store.put('d_'+state.cur,state.days[state.cur]);toast('Saved. Nice work today!');break}
    case 'w_go':{const w=$('#w_wage').value.trim();if(!num(w)){toast('Type in your hourly wage');$('#w_wage').focus();break}
      state.settings.wage=w;if($('#w_anchor').value)state.settings.periodAnchor=$('#w_anchor').value;state.settings.setupDone=true;saveSettings();go('log');toast('All set. Log your first day.');break}
    case 'clearDay':twoStep(t,'clear','Tap again to clear this day',()=>{clearTimeout(dayTimer);dirtyDay=null;const s=state.cur;const had=!!state.days[s];delete state.days[s];if(had)Store.del('d_'+s);renderLog();toast('Day cleared')});break;
    case 'backup':backupData();break;
    case 'wipe':twoStep(t,'wipe','Tap again to delete everything',()=>{
      Object.keys(state.days).forEach(k=>Store.del('d_'+k));Object.keys(state.pays).forEach(k=>Store.del('p_'+k));
      state.days={};state.pays={};toast('All shifts and paychecks deleted');renderSettings()});break;
  }
});
document.addEventListener('input',e=>{
  if(e.target.id==='vbox'){onVoiceEdit();return}
  if(state.view==='log'&&e.target.id!=='datePick'&&e.target.closest('.logform'))onLogInput();
});
document.addEventListener('change',e=>{
  if(state.view==='log'&&e.target.tagName==='SELECT'&&e.target.closest('.logform')){onLogInput();return}
  const id=e.target.id,st=state.settings;
  if(id==='datePick'&&e.target.value){setDay(e.target.value);return}
  if(id==='restore'&&e.target.files&&e.target.files[0]){restoreData(e.target.files[0]);e.target.value='';return}
  const map={s_wage:()=>st.wage=e.target.value.trim(),s_cur:()=>st.currency=e.target.value,s_anchor:()=>{if(e.target.value)st.periodAnchor=e.target.value},
    s_ot:()=>st.otThreshold=num(e.target.value),s_otm:()=>st.otMult=num(e.target.value)||1,s_theme:()=>st.theme=e.target.value,s_voice:()=>st.voice=e.target.checked,s_vlang:()=>st.voiceLang=e.target.value,s_vmode:()=>st.voiceMode=e.target.value};
  if(map[id]){map[id]();saveSettings();toast('Settings saved')}
});
window.addEventListener('pagehide',flushDay);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#vsheet')&&$('#vsheet').classList.contains('open'))closeVoice()});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flushDay()});

/* ---------- start ---------- */
(async()=>{
  try{const l=readLocal();if(l&&l.settings&&l.settings.theme){state.settings.theme=l.settings.theme;applyTheme()}}catch(e){}
  await Store.init();
  if(state.settings.voiceMethodV!==3){state.settings.voiceMode=isIOS()&&isHomeApp()?'keyboard':'auto';state.settings.voiceMethodV=3;if(state.settings.setupDone||wage())saveSettings()}
  applyTheme();state.ready=true;
  setSync(Store.mode==='cloud'?'Synced':'On this device');
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  if(!wage()&&!state.settings.setupDone&&!datesSorted().length)state.view='welcome';
  render();
  handleVoiceURL();
})();
})();
</script>
<script>
if('serviceWorker' in navigator&&location.protocol==='https:'){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
